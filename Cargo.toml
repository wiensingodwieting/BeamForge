[package]
name = "beamforge"
version = "0.2.0"
authors = ["wiensingodwieting"]
edition = "2021"
description = "BeamMP server mod and profile manager"
license = "GPL-3.0-or-later"
repository = "https://github.com/wiensingodwieting/beamforge"

[dependencies]
slint = "1.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.15"
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2"] }

[build-dependencies]
slint-build = "1.9"
