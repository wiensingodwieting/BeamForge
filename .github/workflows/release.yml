name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config cmake libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libgl1-mesa-dev libegl1-mesa-dev

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --verbose

      - name: Extract tag name
        id: tag
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "refs/heads/main" ]; then
            TAG_NAME="v0.1.0"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Package portable archive
        run: |
          TAG="${{ steps.tag.outputs.tag_name }}"
          DIR="beamforge-${TAG}-linux-x86_64"
          mkdir -p "$DIR/ui/icons" "$DIR/ui/fonts" "$DIR/profiles"

          cp target/release/beamforge "$DIR/"
          cp -r ui/icons/* "$DIR/ui/icons/" 2>/dev/null || true
          cp -r ui/fonts/* "$DIR/ui/fonts/" 2>/dev/null || true
          cp run.sh "$DIR/"
          cp install-desktop.sh "$DIR/"
          cp README.md "$DIR/"
          cp LICENSE "$DIR/"
          touch "$DIR/profiles/.gitkeep"

          chmod +x "$DIR/beamforge" "$DIR/run.sh" "$DIR/install-desktop.sh"
          tar -czvf "${DIR}.tar.gz" "$DIR"
          sha256sum "${DIR}.tar.gz" > "${DIR}.tar.gz.sha256"

      - name: Extract Release Notes from CHANGELOG.md
        id: release_notes
        run: |
          python3 -c "
          import re
          tag = '${{ steps.tag.outputs.tag_name }}'.lstrip('v')
          try:
              with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
                  content = f.read()
              pattern = r'## \[' + re.escape(tag) + r'\][^\n]*\n(.*?)(?=\n## \[|\Z)'
              match = re.search(pattern, content, re.DOTALL)
              if match:
                  notes = match.group(1).strip()
              else:
                  notes = 'Release ' + tag
          except Exception as e:
              notes = 'Release ' + tag
          with open('RELEASE_NOTES.md', 'w', encoding='utf-8') as out:
              out.write(notes + '\n\n**Full Changelog**: https://github.com/wiensingodwieting/BeamForge/commits/' + '${{ steps.tag.outputs.tag_name }}' + '\n')
          "

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            beamforge-*-linux-x86_64.tar.gz
            beamforge-*-linux-x86_64.tar.gz.sha256
          name: BeamForge ${{ steps.tag.outputs.tag_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
